name: Build Custom Gaming ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push OCI Image
        uses: docker/build-push-action@v6   # Updated to v6 to clear Node 20 deprecation
        with:
          context: .
          file: ./Containerfile             # Explicitly point to Containerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gaming-os:latest

  build-iso:
    needs: build-container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build ISO Image
        uses: osbuild/bootc-image-builder-action@v1
        with:
          image: ghcr.io/${{ github.repository_owner }}/gaming-os:latest
          types: iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gaming-OS-ISO
          path: output/bootiso/install.iso
