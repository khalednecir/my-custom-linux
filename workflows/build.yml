name: Build Custom Linux Distribution

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libncurses-dev \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          bc \
          cpio \
          syslinux \
          isolinux \
          xorriso \
          wget

    - name: Download Sources (Kernel & BusyBox)
      run: |
        mkdir -p src workspace iso/boot/isolinux
        cd src
        # Download Linux Kernel 6.6 LTS
        wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.21.tar.xz
        tar -xf linux-6.6.21.tar.xz
        
        # Download BusyBox
        wget https://busybox.net/downloads/busybox-1.36.1.tar.bz2
        tar -xf busybox-1.36.1.tar.bz2

    - name: Compile BusyBox & Build Root Filesystem (initramfs)
      run: |
        cd src/busybox-1.36.1
        make defconfig
        # Configure BusyBox to build as a static binary
        sed -i 's/# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
        make -j$(nproc)
        make install
        
        # Prepare initramfs directory structure
        cd ../..
        mkdir -p workspace/initramfs/{bin,sbin,etc,proc,sys,usr/bin,usr/sbin,dev}
        cp -a src/busybox-1.36.1/_install/* workspace/initramfs/
        
        # Create init script
        cat << 'EOF' > workspace/initramfs/init
        #!/bin/sh
        mount -t proc none /proc
        mount -t sysfs none /sys
        echo "=========================================="
        echo " Welcome to My Custom Cloud-Built Linux!  "
        echo "=========================================="
        exec /bin/sh
        EOF
        chmod +x workspace/initramfs/init
        
        # Pack initramfs
        cd workspace/initramfs
        find . -print0 | cpio --null -ov --format=newc | gzip -9 > ../../iso/boot/initrd.img

    - name: Compile Linux Kernel
      run: |
        cd src/linux-6.6.21
        make defconfig
        # Compile kernel image using available CPU cores
        make -j$(nproc) bzImage
        cp arch/x86/boot/bzImage ../../iso/boot/vmlinuz

    - name: Create Bootable ISO Image
      run: |
        # Setup ISOLINUX bootloader
        cp /usr/lib/ISOLINUX/isolinux.bin iso/boot/isolinux/
        cp /usr/lib/syslinux/modules/bios/ldlinux.c32 iso/boot/isolinux/
        
        # Create ISOLINUX config
        cat << 'EOF' > iso/boot/isolinux/isolinux.cfg
        default mylinux
        label mylinux
          kernel /boot/vmlinuz
          append initrd=/boot/initrd.img
        EOF
        
        # Generate the ISO image
        xorriso -as mkisofs -o custom-linux.iso \
          -b boot/isolinux/isolinux.bin \
          -c boot/isolinux/boot.cat \
          -no-emul-boot -boot-load-size 4 -boot-pack-sect \
          -isohybrid-mbr /usr/lib/syslinux/bios/mbr.bin \
          iso/

    - name: Upload ISO Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Custom-Linux-ISO
        path: custom-linux.iso
